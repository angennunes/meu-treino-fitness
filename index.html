:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#39243a;background:#fff5fa}*{box-sizing:border-box}body{margin:0;padding-bottom:85px}header{background:linear-gradient(125deg,#c21869,#ef69a7);color:white;padding:23px 18px 20px;border-radius:0 0 25px 25px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:10px 0}h3{font-size:16px;margin:8px 0}p{line-height:1.4}small,.muted{color:#816c7e}.wrap{max-width:750px;margin:auto;padding:14px}.card{background:white;border:1px solid #f2d3e3;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 3px 12px #a5175710}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#fff0f7;padding:14px;border-radius:15px}.stat b{display:block;font-size:23px;color:#ae145e}.btn{border:0;background:#c21869;color:white;padding:12px 15px;border-radius:12px;font-weight:700;cursor:pointer}.btn.alt{background:#f8e1ee;color:#9e1557}.btn.danger{background:#fff0f0;color:#a5213b}.btn:disabled{opacity:.5}input,select,textarea{width:100%;border:1px solid #e7c4d7;border-radius:11px;padding:11px;font:inherit;background:#fff}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.exercise{border-top:1px solid #f4e3ec;padding:12px 0}.exercise:first-child{border:0}.tag{background:#fce1ee;color:#a41c60;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;gap:2px;background:white;border-top:1px solid #f2c8dd;padding:7px 6px env(safe-area-inset-bottom);z-index:10;box-shadow:0 -4px 20px #50102c12}.nav button{flex:1 0 64px;border:0;background:none;color:#8a6c80;font-size:10px;padding:6px 2px;border-radius:10px}.nav button.active{color:#c21869;background:#ffe7f3;font-weight:800}.nav span{display:block;font-size:21px}.hidden{display:none}.progress{height:12px;border-radius:20px;background:#f3d7e5;overflow:hidden}.progress>div{height:100%;background:#d32c7d}.pill{display:inline-block;border-radius:99px;background:#f8e6f0;padding:6px 9px;margin:3px;font-size:12px}canvas{width:100%;height:190px}.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:12px}.day{border:1px solid #f0d1e1;border-radius:11px;padding:8px;text-align:center;min-height:65px;font-size:12px}.day.done{background:#fbd4e7}.day.today{outline:2px solid #c21869}.day strong{display:block;font-size:18px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.check{width:auto;accent-color:#c21869}.info{background:#fff0f7;border-radius:12px;padding:10px;font-size:13px}.illustration{font-size:35px;background:#fff1f7;border-radius:12px;width:60px;height:60px;display:grid;place-items:center;flex:none}button{font:inherit}a{color:#b11360}#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#3c2535;color:white;padding:10px 16px;border-radius:12px;display:none;z-index:20;white-space:nowrap} .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1} @media(min-width:650px){.grid.three{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div style="max-width:750px;margin:auto"><h1>💗 Meu Treino Fitness</h1><div>Seu progresso, um treino de cada vez 🍑</div></div></header><main class="wrap" id="app"></main><nav class="nav" id="nav"></nav><div id="toast"></div><script>
const KEY='mtf-v1';const days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const workout={1:{name:'Segunda • Glúteos e quadríceps',focus:'Glúteos, quadríceps e hip dips',ex:[['Agachamento livre','2 × 10–12','🧍‍♀️','Pés na largura dos ombros; leve o quadril para trás, flexione os joelhos até uma amplitude confortável e suba.','Quadríceps e glúteos'],['Ponte de glúteos','2 × 12–15','🍑','Deite de costas, joelhos flexionados, pés apoiados. Eleve o quadril sem arquear demais a lombar.','Glúteo máximo'],['Afundo reverso com apoio','2 × 8 por perna','🚶‍♀️','Dê um passo para trás, flexione os joelhos com controle e retorne, segurando um apoio firme.','Glúteos e quadríceps'],['Agachamento búlgaro adaptado','1 × 6–8 por perna','🦵','A partir da semana 2, apoie o pé de trás em superfície baixa e estável; desça pouco, sem dor, com apoio para equilíbrio.','Glúteos e quadríceps'],['Abdução lateral deitada','2 × 12–15 por lado','↗️','Deitada de lado, eleve a perna de cima sem girar o tronco; desça devagar.','Glúteos médio e mínimo'],['Panturrilha em pé','2 × 15','👟','Em pé, com apoio, eleve os calcanhares e retorne lentamente.','Panturrilhas']]},2:{name:'Terça • Peito, ombros e tríceps',focus:'Superiores A + abdômen',ex:[['Flexão na parede','2 × 8–12','🙌','Mãos na parede na altura do peito, corpo alinhado; aproxime o peito e empurre.','Peito, ombros e tríceps'],['Desenvolvimento de ombros','2 × 10–12','🏋️','Com garrafas leves na altura dos ombros, empurre acima da cabeça sem inclinar o tronco.','Ombros e tríceps'],['Elevação lateral','2 × 10–15','💪','Eleve garrafas leves para os lados até perto da altura dos ombros; cotovelos levemente flexionados.','Ombros'],['Tríceps coice','2 × 10–12','↗️','Incline o tronco mantendo costas neutras; cotovelo junto ao corpo, estenda o braço para trás.','Tríceps'],['Dead bug','2 × 8 por lado','🪲','Deitada, braços para cima e quadris/joelhos a 90°. Estenda braço e perna opostos sem perder o controle da lombar.','Abdômen profundo']]},3:{name:'Quarta • Costas, bíceps e abdômen',focus:'Costas, bíceps, postura e core; ajuste o volume conforme a recuperação',ex:[['Remada unilateral com garrafa','2 × 10–12 por braço','🏋️','Apoie uma mão em superfície firme e puxe a garrafa em direção ao quadril, sem girar o tronco.','Costas e bíceps'],['Remada curvada com garrafas','2 × 10–12','💪','Incline o tronco pelo quadril, mantenha a coluna neutra e puxe as garrafas perto do corpo.','Costas e bíceps'],['Pullover com garrafa','2 × 12–15','🙆‍♀️','Deitada, segure uma garrafa leve com as duas mãos e leve-a lentamente para trás da cabeça, somente até onde os ombros estiverem confortáveis.','Costas e peito'],['Rosca direta com garrafas','2 × 10–12','💪','Mantenha os cotovelos próximos ao tronco e flexione os braços sem balançar o corpo.','Bíceps'],['Rosca martelo com garrafas','2 × 10–12','🏋️','Com palmas voltadas uma para a outra, flexione os cotovelos de maneira controlada.','Bíceps e braquial'],['Prancha adaptada + bird dog','2 × 20 s + 8 por lado','🧘‍♀️','Na prancha, apoie joelhos se necessário; no bird dog, estenda braço e perna opostos sem girar o quadril.','Abdômen e estabilidade']]},4:{name:'Quinta • Glúteos e posteriores',focus:'Posteriores e lateral do quadril',ex:[['Stiff com garrafas','2 × 10–12','🏋️','Joelhos levemente flexionados; leve o quadril para trás com coluna neutra e garrafas próximas das pernas.','Posteriores e glúteos'],['Ponte unilateral','2 × 8–10 por perna','🍑','Deitada, mantenha um pé apoiado e eleve o quadril controladamente sem rodar a pelve.','Glúteos'],['Agachamento sumô','2 × 10–12','🦵','Afaste os pés um pouco mais que os ombros, pontas levemente para fora; agache até amplitude confortável.','Glúteos, quadríceps e adutores'],['Coice em quatro apoios','2 × 12 por perna','🐾','Em quatro apoios, empurre um pé para trás e para cima sem arquear a lombar.','Glúteo máximo'],['Fire hydrant','2 × 12 por lado','↗️','Em quatro apoios, eleve o joelho lateralmente sem girar o quadril.','Glúteos médio e mínimo'],['Panturrilha em pé','2 × 15','👟','Eleve e abaixe os calcanhares devagar, com apoio firme.','Panturrilhas']]},5:{name:'Sexta • Costas, bíceps e abdômen',focus:'Superiores B + core',ex:[['Remada unilateral','2 × 10–12 por braço','💪','Uma mão apoiada em superfície firme; puxe a garrafa em direção ao quadril, sem girar o tronco.','Costas e bíceps'],['Remada curvada','2 × 10–12','🏋️','Incline o tronco com quadril para trás, coluna neutra; puxe as garrafas próximas ao corpo.','Costas e bíceps'],['Rosca direta','2 × 10–12','💪','Cotovelos próximos ao tronco, flexione os braços com as palmas voltadas para cima.','Bíceps'],['Rosca martelo','2 × 10–12','💪','Flexione os braços com as palmas voltadas uma para a outra.','Bíceps e braquial'],['Bird dog','2 × 8 por lado','🐾','Em quatro apoios, estenda braço e perna opostos mantendo tronco estável.','Core e estabilidade'],['Prancha com joelhos','2 × 15–25 s','🧘‍♀️','Apoie antebraços e joelhos, mantendo o corpo alinhado e respirando.','Abdômen']]}};
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=Object.assign({start:'2026-11-16',initial:102,goal:75,weights:[],measures:[],photos:[],cardio:[],water:{},food:[],completed:[],sets:{},weekOverride:null},state||{});let tab='inicio',selectedDay=1,calendarMonth=new Date(),showDate=today();function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Armazenamento cheio. Exporte um backup e exclua fotos antigas.')}}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}function week(){return state.weekOverride||Math.min(4,Math.max(1,Math.floor((new Date(today()+'T12:00')-new Date(state.start+'T12:00'))/604800000)+1))}function lastWeight(){return [...state.weights].sort((a,b)=>b.date.localeCompare(a.date))[0]?.value??state.initial}function input(label,id,type='text',value='',extra=''){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}>`}function button(label,fn,alt=false){return `<button class="btn ${alt?'alt':''}" onclick="${fn}">${label}</button>`}function section(title,content){return `<section class="card"><h2>${title}</h2>${content}</section>`}function render(){document.getElementById('nav').innerHTML=[['inicio','🏠','Início'],['treinos','🏋️','Treinos'],['peso','⚖️','Peso'],['medidas','📏','Medidas'],['fotos','📷','Fotos'],['cardio','🚴','Cardio'],['calendario','📅','Agenda'],['agua','💧','Água'],['comida','🥗','Comida']].map(([id,ic,t])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${t}</button>`).join('');document.getElementById('app').innerHTML=({inicio:home,treinos:train,peso:weight,medidas:measures,fotos:photos,cardio:cardio,calendario:calendar,agua:water,comida:food})[tab]();if(tab==='peso')drawChart();}function go(x){tab=x;render();scrollTo(0,0)}function home(){let day=new Date(today()+'T12:00').getDay(),wkt=workout[day];return `<div class="card"><h2>Olá! 🌷</h2><p>Hoje é ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}. Semana ${week()} do ciclo inicial.</p><p class="info">Seu espaço para acompanhar os treinos e hábitos. Peso, meta e gráfico agora ficam exclusivamente na aba <b>⚖️ Peso</b>.</p></div>`+section('💪 Atividade de hoje',`<h3>${wkt?esc(wkt.name):day===6?'Bicicleta moderada':'Descanso completo'}</h3><p>${wkt?esc(wkt.focus):'Respeite seu ritmo e recuperação.'}</p>${button('Abrir meus treinos',"go('treinos')")}`)+section('📊 Seus registros',`<div class="grid"><div class="stat"><b>${state.completed.length}</b><small>Treinos concluídos</small></div><div class="stat"><b>${state.cardio.length}</b><small>Pedaladas registradas</small></div></div>`)+section('⚙️ Ajustes e backup',`${input('Data de início do ciclo de 4 semanas','start','date',state.start)}${button('Salvar data de início','settingsSave()')}<div class="actions">${button('Exportar backup','backup()',true)}</div><label>Importar backup JSON</label><input type="file" accept="application/json" onchange="restore(event)"><p class="muted">Os registros ficam neste navegador. Faça backups regulares.</p>`)}
function settingsSave(){let s=document.getElementById('start').value;if(!s)return alert('Informe uma data válida.');state.start=s;save();render();toast('Data salva')}
function train(){return `<h2>🏋️ Fichas da semana</h2><div class="row">${[1,2,3,4,5].map(d=>`<button class="btn ${selectedDay===d?'':'alt'}" onclick="selectedDay=${d};render()">${days[d]}</button>`).join('')}</div>`+section(workout[selectedDay].name,`<p class="muted">${workout[selectedDay].focus} • Semana ${week()} • descanso 60–120 s</p><div class="info">Semana 1: 1–2 séries; quarta-feira é opcional na readaptação, especialmente se houver fadiga; semana 2: até 2; semanas 3–4: aumente somente se recuperar bem. Búlgaro a partir da semana 2. Use calçado antiderrapante e apoios firmes.</div>${workout[selectedDay].ex.map((x,i)=>`<div class="exercise"><div class="row" style="align-items:start"><div class="illustration">${x[2]}</div><div style="flex:4"><b>${i+1}. ${x[0]}</b><p><span class="tag">${x[1]}</span> <span class="tag">${x[4]}</span></p></div></div><p>${x[3]}</p><label>Registro de hoje (séries, repetições, carga ou observações)</label><input id="set-${i}" placeholder="Ex.: 2 × 10, garrafas 1 L" value="${esc(state.sets[today()+'-'+selectedDay+'-'+i]||'')}"></div>`).join('')}<div class="actions">${button('Salvar séries','saveSets()')}${button('✓ Concluir treino','completeWorkout()')}</div><p class="muted">As demonstrações desta versão são símbolos e instruções. As ilustrações detalhadas das fichas podem ser incorporadas numa atualização.</p>`)}function saveSets(){workout[selectedDay].ex.forEach((_,i)=>state.sets[today()+'-'+selectedDay+'-'+i]=document.getElementById('set-'+i).value);save();toast('Séries salvas')}function completeWorkout(){saveSets();if(!state.completed.some(x=>x.date===today()&&x.day===selectedDay))state.completed.push({id:uid(),date:today(),day:selectedDay});save();toast('Treino concluído! 💗');render()}function weight(){let w=lastWeight(),lost=state.initial-w,progress=Math.min(100,Math.max(0,Math.round(lost/(state.initial-state.goal)*100)));return section('⚖️ Meu peso e minha meta',`<div class="grid three"><div class="stat"><small>Atual</small><b>${w.toFixed(1)} kg</b></div><div class="stat"><small>Meta</small><b>${state.goal.toFixed(1)} kg</b></div><div class="stat"><small>Variação</small><b>${lost.toFixed(1)} kg</b></div></div><p class="muted">Progresso até a meta: ${progress}%</p><div class="progress"><div style="width:${progress}%"></div></div>${input('Peso inicial (kg)','initial','number',state.initial,'step="0.1" min="1"')}${input('Meta de peso (kg)','goal','number',state.goal,'step="0.1" min="1"')}${button('Salvar meta e peso inicial','saveWeightGoals()')}`)+section('📈 Registro e gráfico',`${input('Data','wd','date',today())}${input('Peso (kg)','wv','number','','min="1" max="500" step="0.1"')}${button('Salvar peso','addWeight()')}<canvas id="weightChart" width="650" height="230" aria-label="Gráfico de evolução do peso"></canvas><h3>Histórico</h3>${history(state.weights,x=>`${x.date.split('-').reverse().join('/')} — ${x.value.toFixed(1)} kg`,'weights')}`)}function saveWeightGoals(){let i=+document.getElementById('initial').value,g=+document.getElementById('goal').value;if(!i||!g||g>=i)return alert('A meta deve ser menor que o peso inicial.');state.initial=i;state.goal=g;save();render();toast('Meta atualizada')}
function addWeight(){let date=document.getElementById('wd').value,value=+document.getElementById('wv').value;if(!date||value<=0)return alert('Informe data e peso válido');state.weights.push({id:uid(),date,value});save();render();toast('Peso registrado')}function drawChart(){let c=document.getElementById('weightChart');if(!c)return;let ctx=c.getContext('2d'),arr=[{date:state.start,value:state.initial},...state.weights].sort((a,b)=>a.date.localeCompare(b.date));let vals=arr.map(x=>x.value).concat(state.goal),min=Math.min(...vals)-2,max=Math.max(...vals)+2,w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff6fa';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#e6c3d4';ctx.font='17px system-ui';for(let j=0;j<=4;j++){let y=20+(h-50)*j/4;ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(w-20,y);ctx.stroke();ctx.fillStyle='#76536b';ctx.fillText((max-(max-min)*j/4).toFixed(0),5,y+5)}ctx.strokeStyle='#c21869';ctx.lineWidth=4;ctx.beginPath();arr.forEach((x,i)=>{let px=50+(w-80)*(arr.length===1?.5:i/(arr.length-1)),py=20+(max-x.value)/(max-min)*(h-50);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle='#c21869';arr.forEach((x,i)=>{let px=50+(w-80)*(arr.length===1?.5:i/(arr.length-1)),py=20+(max-x.value)/(max-min)*(h-50);ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#76536b';ctx.fillText('Início',50,h-5);ctx.fillText('Último',w-90,h-5)}function measures(){let fields=['cintura','abdomen','quadril','coxa','braco'];return section('📏 Medidas corporais',`${input('Data','md','date',today())}${fields.map(x=>input(x[0].toUpperCase()+x.slice(1)+' (cm)','m-'+x,'number','','min="1" step="0.1"')).join('')}${button('Salvar medidas','addMeasures()')}<h3>Histórico</h3>${history(state.measures,x=>`${x.date.split('-').reverse().join('/')} — ${fields.filter(k=>x[k]).map(k=>k+': '+x[k]+' cm').join(' • ')}`,'measures')}`)}function addMeasures(){let x={id:uid(),date:document.getElementById('md').value};['cintura','abdomen','quadril','coxa','braco'].forEach(k=>{let v=+document.getElementById('m-'+k).value;if(v>0)x[k]=v});if(Object.keys(x).length<3)return alert('Informe pelo menos uma medida');state.measures.push(x);save();render();toast('Medidas salvas')}function photos(){return section('📷 Fotos de evolução',`<p>Adicione uma foto de frente, lado ou costas. A imagem será reduzida para economizar espaço no celular.</p>${input('Data','pd','date',today())}<label>Posição</label><select id="position"><option>Frente</option><option>Lado</option><option>Costas</option></select><label>Foto</label><input type="file" accept="image/*" id="photoFile">${button('Salvar foto','addPhoto()')}<div class="grid">${[...state.photos].reverse().map(x=>`<div class="card"><img class="thumb" src="${x.data}" alt="Foto de evolução ${esc(x.position)}"><p><b>${esc(x.position)}</b><br><small>${esc(x.date)}</small></p><button class="btn danger" onclick="removeItem('photos','${x.id}')">Excluir</button></div>`).join('')}</div>`)}function addPhoto(){let file=document.getElementById('photoFile').files[0];if(!file)return alert('Selecione uma foto');if(file.size>20e6)return alert('Escolha uma imagem menor que 20 MB');let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let c=document.createElement('canvas'),ratio=Math.min(1,850/Math.max(img.width,img.height));c.width=img.width*ratio;c.height=img.height*ratio;c.getContext('2d').drawImage(img,0,0,c.width,c.height);state.photos.push({id:uid(),date:document.getElementById('pd').value,position:document.getElementById('position').value,data:c.toDataURL('image/jpeg',.68)});URL.revokeObjectURL(url);save();render();toast('Foto salva')};img.onerror=()=>alert('Não foi possível abrir a imagem');img.src=url}function cardio(){return section('🚴 Bicicleta e cardio',`<p class="info">Meta: 3 sessões semanais em ritmo moderado. Terça 20–25 min, quarta 25–35 min (reduza se fizer musculação), sábado 30–40 min. Sem saltos obrigatórios.</p>${input('Data','cd','date',today())}${input('Duração (minutos)','minutes','number',30,'min="1" max="300"')}<label>Atividade</label><select id="ctype"><option>Bicicleta</option><option>Polichinelo sem salto</option><option>Caminhada</option><option>Outra</option></select><label>Intensidade</label><select id="intensity"><option>Leve</option><option selected>Moderada</option><option>Intensa</option></select>${button('Registrar cardio','addCardio()')}<h3>Histórico</h3>${history(state.cardio,x=>`${x.date} — ${esc(x.type)} • ${x.minutes} min • ${esc(x.intensity)}`,'cardio')}`)}function addCardio(){let date=document.getElementById('cd').value,minutes=+document.getElementById('minutes').value;if(!date||minutes<=0)return alert('Informe duração válida');state.cardio.push({id:uid(),date,minutes,type:document.getElementById('ctype').value,intensity:document.getElementById('intensity').value});save();render();toast('Cardio registrado')}function calendar(){let y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();let cells=Array(first).fill('<div></div>');for(let d=1;d<=count;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,done=state.completed.some(x=>x.date===date),pedal=state.cardio.some(x=>x.date===date);cells.push(`<div class="day ${done||pedal?'done':''} ${date===today()?'today':''}"><strong>${d}</strong>${done?'💪':''}${pedal?'🚴':''}</div>`)}return section('📅 Calendário',`<div class="row"><button class="btn alt" onclick="moveMonth(-1)">‹</button><b style="text-align:center;flex:3">${calendarMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="btn alt" onclick="moveMonth(1)">›</button></div><div class="cal">${['D','S','T','Q','Q','S','S'].map(x=>`<b style="text-align:center">${x}</b>`).join('')}${cells.join('')}</div><p class="muted">💪 Musculação concluída • 🚴 Cardio registrado</p><h3>Treinos concluídos</h3>${history(state.completed,x=>`${x.date} — ${workout[x.day]?.name||'Treino'}`,'completed')}`)}function moveMonth(n){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+n,1);render()}function water(){let amount=state.water[showDate]||0;return section('💧 Controle de água',`${input('Data','waterDate','date',showDate,'onchange="showDate=this.value;render()"')}<div class="stat"><small>Total registrado</small><b>${(amount/1000).toFixed(2)} L</b></div><p class="muted">A necessidade de água varia conforme clima, alimentação, atividade e condições de saúde. Ajuste sua meta individual com orientação adequada.</p><div class="actions">${button('+ 200 ml',"addWater(200)")}${button('+ 500 ml',"addWater(500)")}${button('− 200 ml',"addWater(-200)",true)}</div>`)}function addWater(n){state.water[showDate]=Math.max(0,(state.water[showDate]||0)+n);save();render()}function food(){return section('🥗 Diário alimentar',`<p>Registre refeições sem julgamentos. O aplicativo não impõe restrições calóricas automáticas.</p>${input('Data','fd','date',today())}<label>Refeição</label><select id="meal"><option>Café da manhã</option><option>Almoço</option><option>Lanche</option><option>Jantar</option><option>Outro</option></select><label>O que você comeu?</label><textarea id="description" rows="3" placeholder="Alimentos, porções e como se sentiu"></textarea>${button('Salvar refeição','addFood()')}<h3>Histórico</h3>${history(state.food,x=>`${x.date} — ${esc(x.meal)}: ${esc(x.description)}`,'food')}`)}function addFood(){let description=document.getElementById('description').value.trim();if(!description)return alert('Descreva sua refeição');state.food.push({id:uid(),date:document.getElementById('fd').value,meal:document.getElementById('meal').value,description});save();render();toast('Refeição salva')}function history(items,fmt,key){if(!items.length)return '<p class="muted">Nenhum registro ainda.</p>';return [...items].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(x=>`<div class="exercise"><div style="overflow-wrap:anywhere">${fmt(x)}</div><button class="btn danger" style="margin-top:6px;padding:7px" onclick="removeItem('${key}','${x.id}')">Excluir</button></div>`).join('')}function removeItem(key,id){if(!confirm('Excluir este registro?'))return;state[key]=state[key].filter(x=>x.id!==id);save();render()}function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='meu-treino-fitness-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function restore(ev){let f=ev.target.files[0];if(!f)return;if(!confirm('Substituir todos os registros atuais pelos dados do backup?'))return;f.text().then(s=>{let obj=JSON.parse(s);if(!obj||!Array.isArray(obj.weights)||!Array.isArray(obj.completed))throw Error('Formato inválido');state=obj;save();render();toast('Backup importado')}).catch(()=>alert('Backup inválido'))}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
